name: Build and release extensions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NAMIDA_BUILD_SEQUENCE: ${{ github.run_number }}
  NAMIDA_BUILD_ATTEMPT: ${{ github.run_attempt }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Compute build identity
        id: version
        run: node scripts/build-info.cjs --github-output
      - run: npm run test:build
      - run: npm run test:paddle:unit
      - run: node --test tests/tesseract-backend.test.mjs
      - run: python -m unittest discover -s tests -p test_paddle_dictionary.py
      - run: python -m unittest discover -s tests -p test_release_archives.py

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            asset: chromium
          - browser: firefox
            asset: firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build extension
        run: npm run build:${{ matrix.browser }}
      - name: Verify version, identity and browser packaging
        run: node scripts/verify-extension-build.cjs dist ${{ matrix.browser }}
      - name: Install Chromium for the build identity smoke test
        if: matrix.browser == 'chrome'
        run: npx playwright install --with-deps chromium
      - name: Check popup build identity offline
        if: matrix.browser == 'chrome'
        run: npx playwright test tests/build.spec.ts --workers 5
      - name: Package extension ZIP
        env:
          BUILD_VERSION: ${{ needs.quality.outputs.version }}
          ASSET_BROWSER: ${{ matrix.asset }}
        run: |
          mkdir -p release-assets
          (cd dist && zip -q -r "../release-assets/namida-ocr-${ASSET_BROWSER}-${BUILD_VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.asset }}
          path: release-assets/*.zip
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  prerelease:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          pattern: extension-*
          path: release-assets
          merge-multiple: true
      - name: Validate release archives
        env:
          BUILD_VERSION: ${{ needs.quality.outputs.version }}
        run: python scripts/verify-release-archives.py release-assets "$BUILD_VERSION" "$GITHUB_SHA"
      - name: Generate changelog and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.quality.outputs.version }}
          RELEASE_TAG: ${{ needs.quality.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # A rerun must not replace assets after master has moved on.
          if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
            if [[ "$(git rev-parse refs/remotes/origin/master)" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping stale release rerun for $GITHUB_SHA"
              exit 0
            fi
          fi
          # Never repoint an existing build tag to a different checkout.
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'build-*' --sort=-version:refname |
            grep -E '^build-[0-9]+$' | grep -Fvx "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" && "${previous_tag#build-}" -gt "$GITHUB_RUN_NUMBER" ]]; then
            echo "::notice::Skipping build older than $previous_tag"
            exit 0
          fi
          commit_range="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then commit_range="$previous_tag..$GITHUB_SHA"; fi
          notes="$RUNNER_TEMP/namida-release-notes.md"
          {
            printf 'Automated build **%s**, extension version **%s**.\n\n' "$GITHUB_RUN_NUMBER" "$BUILD_VERSION"
            printf 'Source: [`%s`](%s/%s/commit/%s).\n\n' "${GITHUB_SHA::12}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            if [[ -n "$previous_tag" ]]; then
              printf 'Changes since [%s](%s/%s/compare/%s...%s):\n\n' "$previous_tag" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_SHA"
            fi
            git log "$commit_range" --first-parent --pretty=format:'- %s (`%h`)'
            printf '\n\n### Downloads\n\n- Chromium ZIP for Chrome and Edge\n- Firefox ZIP (unsigned; temporary loading or Mozilla signing required)\n- SHA256SUMS for verification\n'
            printf '\nEach ZIP contains manifest.json at its root and build-info.json identifying its source and build attempt.\n'
          } > "$notes"
          (cd release-assets && sha256sum *.zip > SHA256SUMS)
          assets=(release-assets/*.zip release-assets/SHA256SUMS)
          title="Namida build $GITHUB_RUN_NUMBER (${GITHUB_SHA::12})"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi
